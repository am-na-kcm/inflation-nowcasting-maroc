[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    ".venv",
    "venv",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

ignore = [
    "TRY002",
    "BLE001",
    "E402",  # Autorise les imports après les en-têtes de notebooks Databricks
    "E731",  # Autorise l'assignation lambda s = lambda t: ...
]

[tool.ruff.lint.per-file-ignores]
"pipelines/**" = ["F821"]
"models/**" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["."]